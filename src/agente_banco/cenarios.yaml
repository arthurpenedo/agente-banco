# Checagens possíveis (verificadas no ESTADO FINAL do banco, não no texto):
#   cartao: {final, status}         transacao_contestada: id      estorno: id      sem_estorno: id
#   protocolo: true|false           humano: true|false            segunda_via: boleto_id
#   nenhuma_mudanca: true           resposta_contem: regex         resposta_nao_contem: regex
# Clientes: c1 = João Pereira (saldo R$ 2.315,40; cartões 8820 crédito e 1934 débito; t4 é uma cobrança
